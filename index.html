<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover(plan/game/mobile-layout-redesign.md セーフエリア対応):
         PWAの全画面表示でiPhoneのノッチ・ホームインジケータ領域までビューポートを
         広げる。実際の食い込み回避はenv(safe-area-inset-*)を各ゾーンに加算して行う。
         maximum-scale=1, user-scalable=no(plan/game/archive/pinch-zoom-block.md):
         Android Chrome等ではこれでブラウザのピンチズームが無効になる。iOS Safariは
         この指定を無視するため、別途 gesturestart/gesturechange の preventDefault
         (src/main.ts)で対応している -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>少年ガルドと迷いの洞窟</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131a2e'/%3E%3Ccircle cx='16' cy='12' r='7' fill='%23e8c04a'/%3E%3Crect x='9' y='17' width='14' height='11' rx='3' fill='%23a8442a'/%3E%3C/svg%3E"
    />
    <!-- PWA対応(plan/game/archive/pwa-support.md)。base: "./" と同じくPages
         のサブパス配信に合わせて相対パスで参照する -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#05060c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ガルド" />
    <style>
      :root {
        --ink: #e8ecff;
        --dim: #93a0c8;
        --panel: rgba(10, 13, 24, 0.82);
        --edge: rgba(126, 148, 210, 0.28);
        --ok: #58c98a;
        --warn: #e6b455;
        --bad: #e05f6b;

        /*
         * ゾーンレイアウト(plan/touch-ui-overlap-fix.md)。画面を左上・右上・
         * 左下・右下・下部帯のゾーンに分け、同じゾーンに置かれるパネル同士は
         * これらの変数を基準に縦へ積む(バラバラな絶対座標をやめ、タッチの
         * パッド・ボタン・≡メニューと既存HUDが重ならないことを保証する)。
         * 既定(pointer: fine)では触UIが存在しないため0のまま
         */
        --zone-tr-reserve: 0px; /* 右上: ミニマップの高さぶん、≡メニューボタンを下へ押しやる */
        --zone-bottom-reserve: 0px; /* 左下: 仮想パッドの高さぶん、ログを上へ押しやる */

        /*
         * セーフエリア(plan/game/mobile-layout-redesign.md)。各パネルは
         * env(safe-area-inset-*)を直接参照せず、この--safe-*経由で参照する
         * (plan/game/archive/forced-landscape.md: forced-landscape中は下で
         * 参照軸を入れ替えるため、直接参照だと90度ずれる)
         */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060c;
        color: var(--ink);
        font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /*
       * タッチ操作中の文字選択・ズーム誤発動を防ぐ(plan/game/archive/
       * touch-gesture-guard.md)。ログ・HUD等のテキストを長押しすると
       * iOSの選択メニューが誤発動していたため、ゲームUI全体を選択不可に
       * する。命名ダイアログの入力欄だけは下で user-select を戻す。
       * touch-action: manipulation はダブルタップズームだけを抑止する
       * (パン・ピンチはそのまま残す。仮想パッド・ボタン類は既存の
       * touch-action: none を個別に維持)
       */
      body {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
      }
      /*
       * モバイルSafari対応。100vhはアドレスバー/タブバーが畳まれた状態の
       * 「最大」の高さを指すため、実際にそれらが表示されている(ページ読込
       * 直後・タブ切替直後 等)あいだは#appが実際の可視領域より大きくなり、
       * 下部に置いている仮想パッド・アクションボタン群が画面外(可視領域の
       * 外)へはみ出して操作できなくなる。動的ビューポート単位(dvh、実際に
       * 見えている高さに追従する)を使い、対応していない古いブラウザ向けに
       * 100vhを先に書いてフォールバックにする
       */
      #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
      #scene { display: block; width: 100%; height: 100%; }

      #ui { position: absolute; inset: 0; pointer-events: none; }
      /*
       * 村なか歩き中(plan/game/archive/town-3d-exploration.md)は、ダイブ用の
       * HUDを隠す。村にいるのに「地下1階」「HP」や直前のダイブのログ・
       * ミニマップが出たままになるのを防ぐ。
       *
       * #ui ごと隠さないのは、仮想パッド・アクションボタン(#touch)が
       * その中にあり、まとめて隠すとタッチ端末で村を歩けなくなるため。
       * これらの要素は自前の描画処理が style.display を直接書くので、
       * インラインスタイルに勝てるよう !important を付ける
       */
      #ui.village-mode #status,
      #ui.village-mode #allies,
      #ui.village-mode #minimap-wrap,
      #ui.village-mode #log,
      #ui.village-mode #logBanner { display: none !important; }

      /*
       * フォトモード(plan/game/archive/gallery-mode.md)も同じ考え方で、
       * HUDパネルだけを選んで隠す。以前は #ui ごと display:none にしていたが、
       * それだと #touch まで消えてしまい、タッチ端末では撮影も、フォトモードから
       * 抜けることすらできなくなっていた(issue #462)。
       */
      #ui.photo-mode #status,
      #ui.photo-mode #allies,
      #ui.photo-mode #minimap-wrap,
      #ui.photo-mode #log,
      #ui.photo-mode #logBanner { display: none !important; }

      /*
       * フォトモード中に効く操作は「撮影(決定)」と「抜ける(≡)」だけ
       * (移動・攻撃・もちもの等は main.ts の step() が photoMode 中は
       * handleAction を呼ばないので、押しても何も起きない)。押せるのに
       * 反応しないボタンを並べておくと迷わせるので、効くものだけ残す
       */
      #ui.photo-mode .touch-pad,
      #ui.photo-mode .touch-btn:not(.touch-btn-confirm) { display: none !important; }

      /*
       * 図鑑ギャラリー(plan/game/archive/gallery-mode.md)も同様。こちらは
       * 拠点画面(#town)の上から開くので、HUDに加えて#town自体も隠す
       * (#uiごとdisplay:noneにしていた頃はまとめて消えていた)。
       * ギャラリー中に効くのは「戻る(決定)」と、canvasへの二本指での
       * 回転・ズームだけなので、パッド・他のボタン・「≡」は出さない
       */
      #ui.gallery-mode #status,
      #ui.gallery-mode #allies,
      #ui.gallery-mode #minimap-wrap,
      #ui.gallery-mode #log,
      #ui.gallery-mode #logBanner,
      #ui.gallery-mode #town { display: none !important; }

      #ui.gallery-mode .touch-pad,
      #ui.gallery-mode .touch-menu,
      #ui.gallery-mode .touch-menu-btn,
      #ui.gallery-mode .touch-btn:not(.touch-btn-confirm) { display: none !important; }

      /*
       * 拠点画面(#town)は inset:0 の全画面モーダル。#touch と同じ#uiの子で
       * DOM順が後ろなので、開いているあいだ#touchを丸ごと覆ってしまい、
       * タッチではパッドにもボタンにも触れなかった(issue #483。実測でも
       * elementFromPointが全部#town側を返す)。開いているあいだだけ#touchを
       * 前に出して、カーソル移動(パッド)・決定・もどるを届かせる。
       * z-indexは全文ログモーダル(32)より下に置き、そちらが開いたときは
       * 従来どおりログが手前に来るようにする
       */
      #ui.town-open #touch { z-index: 31; }

      /* ダイブ専用のボタンは拠点では効かない(town.handleKeyが飲む)ので出さない */
      #ui.town-open .touch-btn-attack,
      #ui.town-open .touch-btn[data-code="KeyF"],
      #ui.town-open .touch-btn[data-code="KeyG"],
      #ui.town-open .touch-btn[data-code="KeyI"] { display: none !important; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }

      /* ------------------------------------------------ ステータス */
      #status {
        position: absolute;
        top: 14px; left: 14px;
        padding: 10px 14px;
        min-width: 232px;
      }
      #status .row {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 12px;
      }
      #hud-depth { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
      #hud-level { font-size: 13px; color: var(--dim); }
      .bar {
        position: relative;
        height: 11px;
        margin-top: 6px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .bar > i {
        display: block; height: 100%; width: 100%;
        border-radius: 6px;
        transition: width 0.18s ease-out;
      }
      #hud-hp-fill { background: linear-gradient(90deg, #4fd18a, #7ee6a8); }
      #hud-hp-fill[data-level="warn"] { background: linear-gradient(90deg, #e0b755, #f2d27a); }
      #hud-hp-fill[data-level="danger"] { background: linear-gradient(90deg, #e05f6b, #f38b93); }
      #hud-satiety-fill { background: linear-gradient(90deg, #c99a5a, #e2bd85); }
      #hud-satiety-fill[data-level="warn"] { background: linear-gradient(90deg, #e0a049, #f0c073); }
      #hud-satiety-fill[data-level="danger"] { background: linear-gradient(90deg, #d6544f, #ef8a84); }
      .label {
        display: flex; justify-content: space-between;
        font-size: 11px; color: var(--dim); margin-top: 9px;
        letter-spacing: 0.08em;
      }
      #hud-exp { font-size: 11px; color: var(--dim); margin-top: 8px; }
      #hud-status {
        margin-top: 7px; font-size: 12px; color: #ffb0bb; font-weight: 600;
      }

      #hud-carry {
        margin-top: 8px;
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(200, 140, 70, 0.18);
        border: 1px solid rgba(200, 140, 70, 0.45);
        color: #e8bc86;
      }
      #hud-carry[data-kind="bomb"] {
        background: rgba(224, 95, 107, 0.18);
        border-color: rgba(224, 95, 107, 0.5);
        color: #ff9ea6;
      }
      #hud-carry[data-kind="caught"] {
        background: rgba(90, 200, 255, 0.16);
        border-color: rgba(90, 200, 255, 0.45);
        color: #8fdcff;
      }

      /* ------------------------------------------------ なかま */
      #allies {
        position: absolute;
        top: 232px; left: 14px;
        width: 232px;
        padding: 9px 13px;
        display: none;
      }
      .allies-title {
        font-size: 11px; letter-spacing: 0.1em; color: var(--dim);
        padding-bottom: 6px; margin-bottom: 6px;
        border-bottom: 1px solid var(--edge);
      }
      .ally-row {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: 12.5px; margin-top: 6px;
      }
      .ally-name { color: #c9b4ff; font-weight: 600; }
      .ally-hp { font-size: 11px; color: var(--dim); }
      .ally-bar {
        height: 6px; margin-top: 3px; border-radius: 4px;
        background: rgba(255, 255, 255, 0.09); overflow: hidden;
      }
      .ally-bar > i {
        display: block; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, #8a6ce8, #b39cff);
        transition: width 0.18s ease-out;
      }
      .ally-bar > i[data-level="warn"] { background: linear-gradient(90deg, #e0b755, #f2d27a); }
      .ally-bar > i[data-level="danger"] { background: linear-gradient(90deg, #e05f6b, #f38b93); }
      .ally-stance { font-size: 10.5px; color: #7fd6ff; margin-top: 2px; }
      .ally-status { font-size: 10.5px; color: #f2d27a; margin-top: 2px; }

      /* ------------------------------------------------ ミニマップ */
      /* ゾーン: 右上。触UIの≡メニューボタン(#touch側)も同じ右上ゾーンに
         入るため、常にこのパネルの高さぶんだけ下にずれる(--zone-tr-reserve) */
      #minimap-wrap { position: absolute; top: 14px; right: 14px; padding: 8px; }
      #minimap { display: block; image-rendering: pixelated; }

      /* ------------------------------------------------ ログ */
      /* ゾーン: 左下。触UIの仮想パッド(#touch側)も同じ左下ゾーンに入るため、
         パッドの高さぶんだけ上にずれる(--zone-bottom-reserve)。
         plan/game/mobile-layout-redesign.md: タッチ端末ではこの縦長パネルを
         廃止し、#logBanner(帯)+ #logModal(全文)に置き換える。デスクトップ
         (pointer: fine)側はこれまでどおり */
      #log {
        position: absolute;
        left: 14px; bottom: calc(14px + var(--zone-bottom-reserve));
        max-width: 46vw;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.65;
      }

      /* ------------------------------------------------ メッセージ帯(タッチ専用、plan/game/mobile-layout-redesign.md) */
      /* ゾーン: 下部帯の中央。仮想パッド(左下)・アクションボタン群(右下)の
         隙間にちょうど収まる幅で置く(両ゾーンの実測値から算出、下記コメント参照)。
         pointer-events: none にして、下に重なるパッド/ボタンのタップを妨げない。
         pointer: fine では常に非表示(#touchと同じ、既定display:noneを
         @media (pointer: coarse) の中だけblockへ) */
      #logBanner {
        display: none;
        position: absolute;
        z-index: 5;
        padding: 8px 12px;
        max-height: 92px;
        overflow: hidden;
        border-radius: 10px;
        background: rgba(10, 13, 24, 0.58);
        border: 1px solid var(--edge);
        backdrop-filter: blur(4px);
        font-size: 12px;
        line-height: 1.5;
        text-align: left;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      #logBanner:empty,
      #logBanner.faded { opacity: 0; }
      #logBanner div { opacity: 0.6; }
      #logBanner div:last-child { opacity: 1; font-weight: 600; }

      /* ------------------------------------------------ 全文ログモーダル(「≡」→ログ、同上) */
      /* タッチの「≡」メニューからしか開く導線が無いため pointer: coarse に
         限定しない(desktopでも構造上は無害。表示切り替えは.openクラスのみ) */
      #logModal {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 32;
        align-items: flex-end;
        justify-content: center;
        padding: 16px;
        /* セーフエリア対応(plan/game/mobile-layout-redesign.md): 下端に張り付く
           モーダルなので、ホームインジケータの上に閉じるボタンが埋もれないようにする */
        padding-bottom: calc(16px + var(--safe-bottom));
        background: rgba(3, 4, 10, 0.86);
        pointer-events: auto;
      }
      #logModal.open { display: flex; }
      .log-modal-box {
        width: min(640px, 94vw);
        max-height: 82vh;
        overflow-y: auto;
        padding: 16px 18px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
      }
      .log-modal-box h2 {
        margin: 0 0 10px; font-size: 14px; letter-spacing: 0.08em; color: #7fd6ff;
      }
      .log-modal-list { list-style: none; margin: 0; padding: 0; }
      .log-modal-list li {
        padding: 5px 0; font-size: 13px; line-height: 1.6;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .log-modal-close {
        display: block; width: 100%; margin-top: 14px; padding: 10px;
        font-family: inherit; font-size: 13px; letter-spacing: 0.05em;
        color: #05060c; background: #7fd6ff; border: none; border-radius: 8px; cursor: pointer;
      }

      /* ------------------------------------------------ 操作説明 */
      /* ゾーン: 右下。#334: タッチ端末では触UIのアクションボタン群
         (.touch-actions)が同じ右下ゾーンに常時表示されるため、キーボード
         向けのこのパネルは pointer: coarse では出さない(操作説明自体は
         「≡」メニューのH相当から`showKeyHelp`の全画面オーバーレイで見られる、
         plan/touch-ui-overlap-fix.md) */
      #help {
        position: absolute;
        right: 14px; bottom: 14px;
        padding: 9px 13px;
        font-size: 11px;
        color: var(--dim);
        line-height: 1.75;
        text-align: right;
      }
      #help b { color: var(--ink); font-weight: 600; }
      @media (pointer: coarse) {
        #help { display: none; }
      }

      /* ------------------------------------------------ アクセシビリティ */
      /* plan/difficulty-modes.md: メッセージログ・メニューの文字サイズを2段階から選べる */
      body[data-font-size="large"] #log,
      body[data-font-size="large"] #help,
      body[data-font-size="large"] #menu,
      body[data-font-size="large"] #stance,
      body[data-font-size="large"] #arts,
      body[data-font-size="large"] #stairsConfirm,
      body[data-font-size="large"] #town,
      body[data-font-size="large"] #naming,
      body[data-font-size="large"] #village-hint,
      body[data-font-size="large"] .overlay-box,
      body[data-font-size="large"] .ending-box {
        zoom: 1.25;
      }

      /* ------------------------------------------------ 拠点の3D化(plan/town-3d-exploration.md) */
      #village-hint {
        display: none;
        position: absolute;
        left: 50%; bottom: 24px; transform: translateX(-50%);
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        color: #7fd6ff;
      }

      /* ------------------------------------------------ 図鑑ギャラリー */
      #gallery-info {
        display: none;
        position: absolute;
        left: 50%; bottom: 24px; transform: translateX(-50%);
        max-width: 560px;
        padding: 14px 20px;
        text-align: center;
      }
      #gallery-info h2 { margin: 0 0 6px; font-size: 18px; color: #c9b4ff; }
      #gallery-info p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink); }
      #gallery-info .hint { margin-top: 10px; font-size: 11px; color: var(--dim); }

      /* ------------------------------------------------ ダメージ表示 */
      #fx { position: absolute; inset: 0; overflow: hidden; }
      .damage {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 20px;
        font-weight: 800;
        color: #ffd9dd;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px #000;
        animation: float-up 0.9s ease-out forwards;
        pointer-events: none;
      }
      .damage.critical { font-size: 27px; color: #ffe27a; }
      .damage.heal { color: #96f0b8; }
      @keyframes float-up {
        0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
        18% { opacity: 1; transform: translate(-50%, -60%) scale(1.12); }
        100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
      }

      /* ------------------------------------------------ タッチ操作(plan/touch-controls.md) */
      /* タッチ可能な端末(pointer: coarse)でだけ表示する。キーボードとの共存を妨げないよう
         Inputへ直接press/releaseするだけの入力ソースとして重ねる */
      #touch {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: none;
        user-select: none;
        -webkit-user-select: none;
      }
      @media (pointer: coarse) {
        #touch { display: block; }
        :root {
          /*
           * ゾーンレイアウト(plan/game/mobile-layout-redesign.md以降):
           * ミニマップを小さく固定したので、「≡」ボタンをその下に置く
           * オフセットも小さい固定値でよくなった。
           *   右上: ミニマップ(高さ上限96px = canvas92px + padding6*2 + border1*2)
           *         + 隙間12pxの下に「≡」ボタンを置く
           * 仮想パッド側のログ用の予約(--zone-bottom-reserve)は、ログパネル
           * そのものをタッチ端末で非表示にした(#logBanner に置き換えた)ため、
           * もう使われていない。変数だけ残し、値は0で無害化する
           */
          --zone-tr-reserve: 114px;
          --zone-bottom-reserve: 0px;
        }
        /* ミニマップを拡大しているあいだは、「≡」ボタン・メニューをさらに下げる
           (未決事項への回答として実装したタップ拡大トグル。:has()はChromium105+/
           Safari15.4+/Firefox121+で利用可、非対応環境では拡大自体をしないため
           実害は無い) */
        body:has(#minimap-wrap.expanded) {
          --zone-tr-reserve: 248px;
        }

        /* ------------------------------------------------ HUDバー(タッチ専用の横長化) */
        /* plan/game/mobile-layout-redesign.md: 縦積みパネルをやめ、階数・Lv・
           HP・まんぷくを1行に収めた細長いバーにする。DOM/JS(hud.ts)は共通の
           ままで、並びをflexで組み直すだけに留める。次のLvまでの数値は
           優先度が低いため触UIでは省く(未決事項への回答: 経験値・所持金は
           「≡」メニュー・拠点側にゆずる) */
        #status {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          row-gap: 3px;
          column-gap: 10px;
          min-width: 0;
          max-width: calc(100vw - 16px - var(--safe-left) - var(--safe-right));
          min-height: 40px;
          padding: 6px 12px;
          top: calc(8px + var(--safe-top));
          left: calc(8px + var(--safe-left));
        }
        #status .row { display: contents; }
        #hud-depth { font-size: 12px; }
        #hud-level { font-size: 11px; }
        #status .label {
          margin: 0;
          gap: 4px;
          font-size: 10.5px;
          white-space: nowrap;
          justify-content: flex-start;
        }
        #status .bar { width: 34px; height: 7px; margin: 0; }
        #hud-exp { display: none; }
        #hud-status { margin: 0; font-size: 10.5px; }
        #hud-carry { margin: 0; padding: 2px 7px; font-size: 10.5px; }

        /* なかまパネルは、丈の低くなったHUDバーのすぐ下へ寄せる。
           高さは無制限にせず、パッド/ボタン側のゾーンを侵食しないようにする */
        #allies {
          /* HUDバーは状態異常・かかえ中タルの表示が重なると2行に折り返すことが
             あるため、目安の40pxより余裕を持たせたオフセットにする */
          top: calc(70px + var(--safe-top));
          left: calc(8px + var(--safe-left));
          max-height: 38vh;
          overflow-y: auto;
        }

        /* ------------------------------------------------ ミニマップ(タッチ専用の縮小・透過強化) */
        /* 目安: 短辺(横持ちなのでvh)の1/4以下。aspect-ratioでcanvasの縦横比
           (180:140)を保ったまま、高さだけ上限で縛る。タップで拡大/縮小できる
           (未決事項への回答: 状態はCSSクラス1つで表現できコストが低いため採用。
           src/ui/minimap-zoom.ts) */
        #minimap-wrap {
          top: calc(8px + var(--safe-top));
          right: calc(8px + var(--safe-right));
          padding: 6px;
          background: rgba(10, 13, 24, 0.4);
          border-color: rgba(126, 148, 210, 0.16);
          pointer-events: auto;
          touch-action: manipulation;
        }
        #minimap {
          width: auto;
          height: min(25vh, 25vw, 92px);
          aspect-ratio: 180 / 140;
        }
        #minimap-wrap.expanded #minimap {
          height: min(46vh, 46vw, 224px);
        }

        /* ------------------------------------------------ メッセージ帯(バナー) */
        #logBanner {
          display: block;
          left: calc(150px + var(--safe-left));
          right: calc(210px + var(--safe-right));
          bottom: calc(30px + var(--safe-bottom));
        }
        /* デスクトップの縦長ログパネルは廃止し、#logBannerに置き換える */
        #log { display: none; }
      }
      /* ゾーン: 左下。plan/game/mobile-layout-redesign.mdのセーフエリア対応で
         左端・下端にenv(safe-area-inset-*)を足す(iPhoneのホームインジケータ・
         ノッチ回避)。位置自体はここが基準で、メッセージ帯(#logBanner)側が
         この右端を避けて配置される(上のCSS参照) */
      .touch-pad {
        position: absolute;
        left: calc(26px + var(--safe-left));
        bottom: calc(26px + var(--safe-bottom));
        width: 108px; height: 108px;
        border-radius: 50%;
        background: rgba(10, 13, 24, 0.55);
        border: 1px solid var(--edge);
        pointer-events: auto;
        touch-action: none;
      }
      .touch-pad-knob {
        position: absolute;
        left: 50%; top: 50%;
        width: 46px; height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(127, 190, 255, 0.32);
        border: 1px solid rgba(127, 190, 255, 0.6);
        pointer-events: none;
        transition: transform 0.05s linear;
      }
      /* ゾーン: 右下。#help(操作説明)は同ゾーンに入るが pointer: coarse では
         非表示にしてある(#help側の定義を参照)ため、常に単独で使える。
         セーフエリア対応(右端・下端) */
      .touch-actions {
        position: absolute;
        right: calc(18px + var(--safe-right));
        bottom: calc(22px + var(--safe-bottom));
        display: grid;
        grid-template-columns: repeat(3, 52px);
        gap: 10px;
      }
      .touch-btn, .touch-menu-btn, .touch-menu button {
        font-family: inherit;
        cursor: pointer;
      }
      .touch-btn {
        pointer-events: auto;
        width: 52px; height: 52px;
        border-radius: 50%;
        background: rgba(10, 13, 24, 0.62);
        border: 1px solid var(--edge);
        color: var(--ink);
        font-size: 12px;
        touch-action: none;
      }
      .touch-btn:active { background: rgba(127, 190, 255, 0.28); }
      .touch-btn-confirm {
        background: rgba(127, 190, 255, 0.22);
        border-color: rgba(127, 190, 255, 0.55);
        font-weight: 700;
      }
      /* 攻撃(plan/attack-button.md): 常時押せる新規ボタン。他アクションと
         見た目で区別できるよう、確定ボタンとは別の色味にする */
      .touch-btn-attack {
        background: rgba(255, 138, 128, 0.22);
        border-color: rgba(255, 138, 128, 0.55);
        font-weight: 700;
      }
      /* ゾーン: 右上。ミニマップ(#minimap-wrap)と同じゾーンに入るため、
         --zone-tr-reserveぶんだけその下に押しやる。セーフエリア対応(右端・上端) */
      .touch-menu-btn {
        position: absolute;
        right: calc(16px + var(--safe-right));
        top: calc(16px + var(--safe-top) + var(--zone-tr-reserve));
        pointer-events: auto;
        width: 42px; height: 42px;
        border-radius: 8px;
        background: rgba(10, 13, 24, 0.62);
        border: 1px solid var(--edge);
        color: var(--ink);
        font-size: 18px;
        touch-action: none;
      }
      .touch-menu {
        position: absolute;
        right: calc(16px + var(--safe-right));
        top: calc(64px + var(--safe-top) + var(--zone-tr-reserve));
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        width: 168px;
        /* 項目数が増えても(plan/game/mobile-layout-redesign.mdで「ログ」を追加)
           横幅の狭い横持ち画面(短辺400px級の端末)からはみ出さないよう、
           高さを画面基準で抑えて自前でスクロールさせる */
        max-height: calc(100vh - 64px - var(--safe-top) - var(--zone-tr-reserve) - 12px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      .touch-menu button {
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--edge);
        color: var(--ink);
        font-size: 12px;
        text-align: left;
        touch-action: none;
      }

      /* ------------------------------------------------ 縦持ちでの強制横向き(plan/game/archive/forced-landscape.md) */
      /*
       * タッチ端末(pointer: coarse)かつ縦持ち(orientation: portrait)のときだけ、
       * `src/ui/orientation-guard.ts`がdocument.bodyへforced-landscapeクラスを
       * 付ける。専用の縦持ちレイアウトは作らず(意図的に対象外)、ゲーム画面
       * (#app、3Dビューポート・HUD一式)そのものを90度回転させ、横向きの
       * まま描画する。案内文で「横に持ち替えてください」と要求する代わりに、
       * ひと目で伝わる見た目で誘導する狙い(HTML5ゲームで広く使われる定石)。
       * OS側の画面回転ロックが縦向きで固定されていて`orientation: portrait`
       * が変わらないケースでも、この方式なら端末を物理的に横へ持ち替えるだけで
       * 正しいレイアウトになる(旧方式の案内画面は、回転ロック中は永遠に
       * 案内から抜けられない実質バグを抱えていた)。
       *
       * 横向きに戻せば`orientation: portrait`が外れてクラスごと外れ、
       * 自動的に通常の横持ちレイアウトへ戻る(既存の`change`イベント監視の
       * まま、リロード不要)。
       *
       * 幅・高さは100dvh/100dvwで入れ替え、transform-origin: top leftを
       * 基準にrotate(90deg)(時計回り)してtranslateY(-100%)で画面内へ
       * はめ込む。デスクトップ(pointer: fine)ではクラスが付かないため無効。
       *
       * 入力座標の補正(PointerEventのclientX/Yは回転前の画面座標系のまま
       * 届く)は`src/ui/touch-controls.ts`側で行う(要素の当たり判定は
       * ブラウザがtransformを考慮するため補正不要、生座標から差分を計算する
       * 箇所のみ対象)。
       */
      body.forced-landscape #app {
        width: 100dvh;
        height: 100dvw;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
      }
      /*
       * セーフエリアの参照軸入れ替え。env(safe-area-inset-*)はCSSの
       * transformとは無関係に、端末の物理的な向き(ここでは縦持ちのまま)
       * での上下左右を指し続ける。90度回転して描画しているレイアウト側の
       * 上下左右とはズレる(rotate(90deg) translateY(-100%)の変換から
       * 逆算すると、レイアウト上のtopが物理right、rightが物理bottom、
       * bottomが物理left、leftが物理topに対応する)ため、forced-landscape
       * 中は--safe-*の参照元を90度分ずらす。
       * 実機での確認はできておらず、幾何計算から導いた対応(未検証、
       * plan/game/archive/forced-landscape.md参照)。ズレていた場合は
       * ここを直せば各パネルの実装には触れずに直る
       */
      body.forced-landscape {
        --safe-top: env(safe-area-inset-right, 0px);
        --safe-right: env(safe-area-inset-bottom, 0px);
        --safe-bottom: env(safe-area-inset-left, 0px);
        --safe-left: env(safe-area-inset-top, 0px);
      }

      /* ------------------------------------------------ メニュー */
      #menu, #stance, #arts, #stairsConfirm {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 340px;
        max-height: 74vh;
        overflow-y: auto;
        padding: 14px 16px;
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      .menu-title {
        margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
        color: var(--dim); padding-bottom: 8px;
        border-bottom: 1px solid var(--edge);
      }
      .menu-list, .menu-sub { list-style: none; margin: 8px 0 0; padding: 0; }
      .menu-list li, .menu-sub li {
        padding: 5px 10px; border-radius: 5px; font-size: 14px;
      }
      .menu-list li.selected, .menu-sub li.selected {
        background: rgba(127, 190, 255, 0.20);
        box-shadow: inset 2px 0 0 #7fd6ff;
      }
      .menu-list li.disabled { color: var(--dim); }
      .menu-sub {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid var(--edge);
      }
      .menu-desc {
        margin-top: 9px; font-size: 12px; color: var(--dim); line-height: 1.6;
      }
      .menu-empty { margin-top: 12px; font-size: 13px; color: var(--dim); }
      .menu-hint {
        margin-top: 11px; font-size: 11px; color: #6b789e; text-align: right;
      }

      /* ------------------------------------------------ 拠点 */
      #town {
        position: absolute; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(4, 5, 12, 0.88);
        pointer-events: auto;
      }
      /*
       * 縦は「見出し類 → 列(ここだけ伸縮して余りを取る) → もぐる」の3段。
       * 以前は箱ごとスクロールさせ、もぐるをsticky bottomで浮かせていたが、
       * スマホの低い画面(横向きで実効360px前後)では列が画面に収まらず、
       * 浮いたボタンが列パネルの上に重なって中身を隠していた(issue #482)。
       * 列側だけをスクロール領域にすれば、ボタンは常に列の下の別の段に入り、
       * どの画面幅・高さでも重ならない
       */
      .town-box {
        width: min(1180px, 96vw);
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        padding: 26px 32px 22px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
      }
      .town-box h2 {
        margin: 0 0 6px; font-size: 22px; letter-spacing: 0.12em; color: #7fd6ff;
      }
      /* 建物・村人ごとの役割メニュー(plan/game/archive/village-scoped-menus.md):
         近づいて入った建物名の見出し */
      .town-building { margin: 0 0 10px; font-size: 13px; color: #b6c1e4; }
      .town-stats { margin: 0 0 12px; font-size: 12px; color: var(--dim); }
      .town-lead {
        margin: 0 0 18px; font-size: 12.5px; color: #b6c1e4; line-height: 1.75;
      }
      /*
       * 拠点の機能が増えるほど列も増えていくため(現在14列)、幅を均等割り
       * (flex:1)にすると文字が1文字ずつ折り返される事態になる。列ごとに
       * 最低幅を確保し、収まりきらない分は横スクロールで見る
       */
      /* 見出し・説明・脚注は縮ませない。既定のflex-shrink:1のままだと、
         低い画面で文字が行の途中で切り取られて壊れて見える。伸縮して
         余りを引き受けるのは列だけにする */
      .town-box > * { flex: none; }
      .town-box > .town-columns { flex: 1 1 auto; min-height: 0; }

      /* 伸縮して余った高さを全部取る。min-height:0が無いとflexアイテムは
         中身より縮まないため、低い画面でスクロールせずはみ出す */
      .town-columns {
        display: flex;
        gap: 14px;
        overflow: auto;
        flex: 1 1 auto;
        min-height: 0;
        padding-bottom: 4px;
      }
      .town-col {
        flex: 0 0 168px;
        min-height: 210px;
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
      }
      .town-col.active { border-color: #7fd6ff; box-shadow: 0 0 0 1px rgba(127, 214, 255, 0.35); }
      .town-col-title {
        margin: 0 0 7px; font-size: 12px; font-weight: 400; color: var(--dim); letter-spacing: 0.08em;
        padding-bottom: 7px; border-bottom: 1px solid var(--edge);
        cursor: pointer;
      }
      .town-col ul { list-style: none; margin: 0; padding: 0; }
      .town-col li { padding: 4px 8px; border-radius: 5px; font-size: 13.5px; cursor: pointer; }
      .town-col li.empty { color: #5c6788; font-size: 12px; }
      .town-col li.selected {
        background: rgba(127, 190, 255, 0.20);
        box-shadow: inset 2px 0 0 #7fd6ff;
      }
      .town-col li.chosen { color: #96f0b8; }
      .town-col li.chosen::before { content: "✓ "; }
      .town-col li.axis { color: #ffe27a; }
      .town-desc {
        margin: 14px 0 0; min-height: 20px; font-size: 12px; color: var(--dim);
      }
      .town-hint { margin: 10px 0 0; font-size: 11px; color: #6b789e; text-align: right; }
      .town-mood { margin: 4px 0 10px; font-size: 11px; color: #9aa8cc; }
      .town-flavor { margin: 4px 0 0; font-size: 11px; color: #8a94b8; font-style: italic; }
      /* タッチ操作向け(#308): どの列にいてもSpaceで潜れるのと同じ操作を、
         キーボードが無くても行えるようにする常時表示のボタン。.town-boxが
         自前でスクロールするので、position:stickyでその下端に張り付ける */
      /* stickyで浮かせるのをやめ、列の下の段に置く(上の.town-boxのコメント参照) */
      .town-depart-button {
        flex: none;
        display: block; width: auto; margin-top: 16px;
        padding: 10px; font-size: 14px; letter-spacing: 0.08em;
        color: #05060c; background: #7fd6ff; border: none; border-radius: 8px;
        cursor: pointer;
      }
      /* タッチ端末では右下にアクションボタン群(#touch)が乗る。拠点画面を
         開いているあいだはそれが手前に来る(issue #483)ので、その幅ぶん
         空けて「もぐる」が下に潜り込まないようにする。
         3列×52px + 隙間2×10px + 右端18px ≒ 194px */
      @media (pointer: coarse) {
        .town-depart-button { margin-right: calc(200px + var(--safe-right)); }
      }

      /*
       * 低い画面(スマホ横向きで実効340px前後)向けの詰め(issue #482)。
       * 見出し・説明・脚注だけで335px使ってしまい、肝心の列に4pxしか
       * 残らなかった。余白と文字を詰めて、余りを列に回す。
       * 説明文(.town-lead)は行数が場面によって変わるので、高さを頭打ちに
       * して中でスクロールさせる
       */
      @media (max-height: 560px) {
        .town-box { padding: 12px 18px 10px; }
        .town-box h2 { font-size: 17px; margin-bottom: 2px; }
        .town-building { margin-bottom: 4px; }
        .town-stats { margin-bottom: 4px; }
        /* 行の途中で切れると壊れて見えるので、行単位で丸めて省略記号にする。
           同じ内容は「≡」→設定の操作説明から全文を読める */
        .town-lead {
          margin-bottom: 6px;
          line-height: 1.5;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .town-desc { margin-top: 6px; }
        .town-flavor { margin-top: 2px; }
        .town-hint { margin-top: 4px; }
        .town-depart-button { margin-top: 8px; padding: 7px; }
        /* 列自体の下限を外す。ここが210pxのままだと、狭い表示領域の中で
           必ず縦スクロールが出て、1画面に1〜2行しか見えなくなる */
        .town-col { min-height: 0; }
      }

      /* ------------------------------------------------ 命名(plan/game/archive/companion-naming.md) */
      #naming {
        position: absolute; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(3, 4, 10, 0.82);
        pointer-events: auto;
      }
      /*
       * 仲間になった瞬間の一時停止(plan/game/archive/companion-recruit-showcase.md):
       * 背後は暗転させたモーダルではなく、実際に見せたい回転台のモデル
       * (GalleryView)そのものなので、通常の命名(ねむり小屋の改名)と違って
       * 暗い幕を張らない。GalleryViewはどの種族も画面下寄り・やや小さめに
       * 映す構図なので(図鑑ギャラリーと共通の構図。ここは変えない)、
       * 入力欄は逆に画面上側へ置き、モデルの姿にかぶらないようにする
       */
      #naming.naming-showcase {
        background: transparent;
        align-items: flex-start;
        padding-top: 28px;
      }
      .naming-box {
        width: min(320px, 90vw);
        padding: 20px 24px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        text-align: center;
      }
      .naming-box h3 {
        margin: 0 0 14px; font-size: 15px; color: #7fd6ff; font-weight: 700;
      }
      .naming-input {
        width: 100%; box-sizing: border-box;
        padding: 8px 10px; font-size: 15px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--edge); border-radius: 6px;
        color: inherit; font-family: inherit;
      }
      .naming-input:focus { outline: none; border-color: #7fd6ff; }
      .naming-hint {
        margin: 10px 0 0; font-size: 11px; color: #6b789e; text-align: right;
      }

      /* ------------------------------------------------ セーブ枠選択(plan/save-slots.md) */
      #slotSelect {
        position: absolute; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(3, 4, 10, 0.92);
        pointer-events: auto;
      }
      .slot-box {
        width: min(420px, 92vw);
        padding: 24px 28px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
      }
      .slot-box h2 {
        margin: 0 0 16px; font-size: 18px; letter-spacing: 0.1em; color: #7fd6ff; text-align: center;
      }
      .slot-box ul { list-style: none; margin: 0; padding: 0; }
      .slot-row {
        padding: 10px 12px; margin-bottom: 8px;
        border-radius: 8px; border: 1px solid transparent;
        display: flex; justify-content: space-between; align-items: baseline;
        cursor: pointer;
      }
      .slot-row.selected {
        background: rgba(127, 214, 255, 0.16);
        border-color: #7fd6ff;
      }
      .slot-row .slot-name { font-size: 14.5px; }
      .slot-row .slot-detail { font-size: 11.5px; color: var(--dim); }
      .slot-row.empty .slot-name { color: #96f0b8; }
      .slot-hint { margin: 14px 0 0; font-size: 11px; color: #6b789e; text-align: center; }
      .slot-confirm { margin: 10px 0 0; font-size: 12px; color: var(--warn); text-align: center; }

      /* ------------------------------------------------ 全画面表示 */
      #overlay {
        position: absolute; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(3, 4, 10, 0.82);
        pointer-events: auto;
      }
      .overlay-box { text-align: center; padding: 30px 44px; }
      .overlay-box h2 {
        margin: 0 0 12px; font-size: 30px; letter-spacing: 0.1em; color: #7fd6ff;
      }
      .overlay-box p { margin: 6px 0; font-size: 15px; }
      .overlay-box .hint { margin-top: 20px; font-size: 12px; color: var(--dim); }
      /*
       * ダイブ終了オーバーレイの「拠点にもどる」(plan/game/gameover-touch-return.md)。
       * #overlayはinset:0・pointer-events:autoで画面全体を覆い、下にある
       * タッチUI(仮想パッド・「≡」メニュー)へのタップをすべて奪うため、
       * これが無いとタッチ端末では拠点に戻る手段が1つも無くなる。
       * 指で押しやすいよう、タッチボタン(.touch-btn)と同等の高さを確保する
       */
      .overlay-button {
        margin-top: 18px;
        padding: 12px 28px;
        min-height: 44px;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 0.08em;
        color: #05060c;
        background: #7fd6ff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .overlay-button:active { background: #5fc2f0; }

      /* ------------------------------------------------ エンドロール(plan/ending-sequence.md) */
      #ending {
        position: absolute; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(3, 4, 10, 0.92);
        pointer-events: auto;
      }
      .ending-box {
        text-align: center;
        padding: 30px 44px;
        max-width: 520px;
        max-height: 78vh;
        overflow-y: auto;
      }
      .ending-box h2 {
        margin: 0 0 16px; font-size: 22px; letter-spacing: 0.14em; color: #7fd6ff;
      }
      .ending-box ul { list-style: none; margin: 0; padding: 0; }
      .ending-box li { margin: 6px 0; font-size: 14px; color: var(--ink); }
      .ending-box p { margin: 8px 0; font-size: 15px; line-height: 1.7; }
      .ending-hint { margin-top: 22px; font-size: 12px; color: var(--dim); }

      /* ------------------------------------------------ 出先デバッグパネル(plan/mobile-debug-panel.md) */
      /* ?debug=1のときだけ src/ui/debug-panel.ts が中身を生成する。通常は空のまま非表示 */
      #debugPanel {
        display: none;
        position: absolute;
        left: 8px; top: 8px;
        width: min(300px, 84vw);
        max-height: 62vh;
        overflow-y: auto;
        padding: 8px 10px;
        pointer-events: auto;
        font-size: 11px;
        line-height: 1.5;
        z-index: 30;
      }
      #debugPanel:not(:empty) { display: block; }
      .debug-panel-title {
        margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #ff9ea6;
      }
      .debug-panel-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
      .debug-panel-row button {
        font-family: inherit; font-size: 11px; padding: 4px 8px;
        border-radius: 6px; background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--edge); color: var(--ink); cursor: pointer;
      }
      .debug-panel-row button:active { background: rgba(127, 190, 255, 0.24); }
      .debug-panel-log { list-style: none; margin: 0 0 8px; padding: 0; max-height: 130px; overflow-y: auto; }
      .debug-panel-log li {
        color: var(--bad); border-bottom: 1px solid var(--edge);
        padding: 3px 0; word-break: break-all;
      }
      .debug-panel-log li.warn { color: var(--warn); }
      .debug-panel-snapshot {
        margin: 0; padding: 6px; max-height: 160px; overflow-y: auto;
        background: rgba(255, 255, 255, 0.04); border-radius: 6px;
        white-space: pre-wrap; word-break: break-all; font-size: 10px;
      }

      #loading {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px;
        background: #05060c; z-index: 10;
      }
      #loading h1 {
        font-size: 20px; letter-spacing: 0.26em; font-weight: 600; color: #7fd6ff; margin: 0;
      }
      #loading p { font-size: 12px; color: var(--dim); margin: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="ui">
        <div id="status" class="panel" aria-label="ステータス">
          <div class="row">
            <span id="hud-depth">地下 1 階</span>
            <span id="hud-level">Lv 1</span>
          </div>
          <div class="label"><span id="hud-hp-label">HP</span><span id="hud-hp-text">25 / 25</span></div>
          <div class="bar"><i id="hud-hp-fill" aria-hidden="true"></i></div>
          <div class="label"><span id="hud-satiety-label">まんぷく</span><span id="hud-satiety-text">100</span></div>
          <div class="bar"><i id="hud-satiety-fill" aria-hidden="true"></i></div>
          <div id="hud-exp">次のLvまで 10</div>
          <div id="hud-status"></div>
          <div id="hud-carry"></div>
        </div>

        <div id="allies" class="panel" aria-label="なかま"></div>

        <div id="minimap-wrap" class="panel" aria-hidden="true">
          <canvas id="minimap" width="180" height="140"></canvas>
        </div>

        <div id="log" class="panel" aria-live="polite" aria-atomic="false"></div>

        <!-- メッセージ帯(タッチ専用、plan/game/mobile-layout-redesign.md)。
             直近数行だけを表示し、無操作でフェードアウトする。#logの内容(全文)は
             src/view/hud.tsが#logBannerとは別の履歴として持ち、こちらは
             src/view/hud.tsのlog()が直接書き換える -->
        <div id="logBanner" aria-live="polite" aria-atomic="false"></div>

        <div id="help" class="panel">
          <b>矢印 / WASD / テンキー</b> 移動・攻撃<br />
          <b>Shift + 方向</b> 向きだけ変える<br />
          <b>Space</b> 拾う・階段をおりる &nbsp; <b>.</b> 足踏み<br />
          <b>F</b> タルを持つ / 置く &nbsp; <b>G</b> タルを投げる<br />
          <b>I</b> もちもの &nbsp; <b>T</b> 仲間に指示<br />
          <b>C</b> 技を繰り出す<br />
          <b>R</b> 階段の上で区切って持ち帰る<br />
          <b>Q / E</b> 視点回転 &nbsp; <b>± </b>ズーム<br />
          <b>P</b> フォトモード &nbsp; <b>H</b> 操作説明
        </div>

        <div id="fx"></div>
        <div id="touch"></div>
        <div id="menu"></div>
        <div id="stance"></div>
        <div id="arts"></div>
        <div id="stairsConfirm"></div>
        <div id="town"></div>
        <div id="slotSelect"></div>
        <div id="overlay"></div>

        <!-- 全文ログモーダル(「≡」→ログ、plan/game/mobile-layout-redesign.md)。
             タッチの「≡」メニューからのみ開く導線を持つ -->
        <div id="logModal" aria-hidden="true">
          <div id="logModalBox" class="log-modal-box" role="dialog" aria-label="ログ全文">
            <h2 id="logModalTitle">ログ</h2>
            <ul id="logModalList" class="log-modal-list"></ul>
            <button type="button" id="logModalClose" class="log-modal-close">とじる</button>
          </div>
        </div>

        <div id="ending"></div>
        <div id="debugPanel" class="panel"></div>
      </div>

      <div id="gallery-info" class="panel"></div>
      <div id="village-hint" class="panel"></div>
      <!--
        仲間になった瞬間の一時停止(plan/game/archive/companion-recruit-showcase.md):
        #uiRoot(#ui)ごとHUDを隠している間もこのダイアログ自体は見せたいので、
        #uiの外(#appの直下)に置く。#appはposition:relativeなので、
        inset:0の意味は#uiの中にあった時と変わらない
      -->
      <div id="naming"></div>

      <div id="loading">
        <h1>少年ガルドと迷いの洞窟</h1>
        <p>モデルを読み込んでいます…</p>
      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
