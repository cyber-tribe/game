name: モデルのビルド

# Blender (bpy) は約374MBのダウンロードと1GB近い展開を伴うので、毎回の CI では回さない。
# モデル制作スクリプトに手を入れたときと、手動で叩いたときだけ走らせる。
on:
  push:
    paths:
      - "tools/models/**"
      - "tools/build_models.py"
      - ".github/workflows/models.yml"
  pull_request:
    paths:
      - "tools/models/**"
      - "tools/build_models.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-models:
    name: スクリプトからモデルを作り直せるか
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # bpy 5.0 の wheel は CPython 3.11 専用。他のバージョンでは入らない。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: bpy を入れる
        run: |
          python -m pip install --upgrade pip
          pip install bpy

      # プレビューのレンダリングは飛ばす。造形の良し悪しは人が見て判断するもので、
      # ここで確かめたいのは「スクリプトが最後まで走って .glb が出るか」だけ。
      - name: 全モデルをビルド
        run: python tools/build_models.py --no-preview

      # 作り直した .glb を、コミット済みのものと同じ基準で検査する。
      # スクリプトを壊したまま気づかない、という事態を防ぐ。
      - name: できたモデルを検査
        run: npm run test -- tests/models.test.ts

      - name: 生成物を残す
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: public/models/
          retention-days: 7

      # コミット済みの .glb と作り直したものがずれていたら知らせる。
      # Blender の出力は完全に同一とは限らないので、失敗にはせず注意書きに留める。
      - name: コミット済みとの差分を確認
        run: |
          if git diff --quiet -- public/models; then
            echo "コミット済みの .glb と一致しています。"
          else
            echo "::warning::作り直した .glb がコミット済みのものと異なります。"
            echo "スクリプトを変えたなら npm run models を実行して結果をコミットしてください。"
            git diff --stat -- public/models
          fi
