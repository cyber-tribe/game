name: モデルのビルド

# Blender (bpy) は約374MBのダウンロードと1GB近い展開を伴うので、毎回の CI では回さない。
# モデル制作スクリプトに手を入れたときと、手動で叩いたときだけ走らせる。
#
# ci.yml と同じく、push は main だけに絞ってある。ブランチ push と PR の両方を拾うと、
# 同じコミットに対して同じジョブが二重に走ってしまう。
on:
  push:
    branches: [main]
    paths:
      - "tools/models/**"
      - "tools/build_models.py"
      - "tools/compare_models.mjs"
      - "public/models/**"
      - ".github/workflows/models.yml"
  # **pull_request では paths で絞らない。** トリガー自体を絞ると、
  # ワークフローが一度も起動しないコミットに対して必須ステータスチェックが
  # いつまでも「pending」のままになり、マージできなくなる
  # (実測: モデルを触らない PR #1024 が全チェック緑のまま blocked で止まった)。
  # ci.yml と同じく、常に起動させてジョブ側の if で中身を飛ばす。
  # スキップされたジョブはステータスチェック上「成功」として扱われる。
  #
  # push (main) 側は必須チェックの対象ではないので、重い Blender の
  # 実行を避けるために paths で絞ったままにしてある。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更されたファイルを見て、重いジョブ(Blender で全モデルを作り直す)を
  # 実行する必要があるかを判定する。ci.yml の changes ジョブと同じ作り。
  changes:
    name: 変更内容を判定(モデル)
    # PR のときだけ動かす。このジョブはチェックアウトせず GitHub API で
    # 変更ファイル一覧を取る作りで、それは pull_request イベントでしか効かない。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      models: ${{ steps.filter.outputs.models }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            models:
              - "tools/models/**"
              - "tools/build_models.py"
              - "tools/compare_models.mjs"
              - "public/models/**"
              - ".github/workflows/models.yml"

  build-models:
    name: スクリプトからモデルを作り直せるか
    needs: changes
    # 先頭の !cancelled() は必須。GitHub は「needs のジョブがスキップされたら
    # 後続もスキップ」を既定とし、if に always()/!cancelled() 等を書いたときだけ
    # それを上書きできる。これが無いと、changes が PR 以外でスキップされるのに
    # 引きずられて build-models ごとスキップされ、main への push で何も検査されない。
    #
    # changes ジョブ自体が失敗した(API 障害など)場合は、判定不能を
    # 「スキップしてよい」ではなく「フル実行する」側に倒す。
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.models == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # bpy 5.0 の wheel は CPython 3.11 専用。他のバージョンでは入らない。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: コミット済みの .glb を控えておく
        run: cp -r public/models /tmp/committed-models

      - name: bpy を入れる
        run: |
          python -m pip install --upgrade pip
          pip install bpy

      # プレビューのレンダリングは飛ばす。造形の良し悪しは人が見て判断するもので、
      # ここで確かめたいのは「スクリプトが最後まで走って .glb が出るか」だけ。
      - name: 全モデルをビルド
        run: python tools/build_models.py --no-preview

      # 作り直した .glb を、コミット済みのものと同じ基準で検査する。
      # スクリプトを壊したまま気づかない、という事態を防ぐ。
      - name: できたモデルを検査
        run: npm run test -- tests/models.test.ts

      # コミット済みのものと突き合わせる。バイト単位では比較できない
      # (Blender の出力は同じマシン・同じ入力でも実行ごとに揺れる)ので、
      # 頂点数・クリップ名といった構造だけを比べる。詳しくは compare_models.mjs を参照。
      - name: コミット済みと食い違っていないか
        run: node tools/compare_models.mjs /tmp/committed-models public/models

      - name: 生成物を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: public/models/
          retention-days: 7
