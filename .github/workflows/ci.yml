name: CI

# PR には必ず、main への push にも走らせる。
# ブランチ push と PR の両方を拾うと同じコミットで二重に走るので、
# push は main だけに絞ってある。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更されたファイルを見て、重いジョブ(型・テスト・ビルド / 通しプレイ)を
  # 実行する必要があるかを判定する。
  #
  # ここで「トリガー自体」を paths で絞ってしまうと楽だが、それをやると
  # ブランチ保護の必須ステータスチェックと相性が悪い。ワークフローが
  # 一度も起動しないコミットに対しては、必須チェックがいつまでも
  # 「pending」のままになり、マージできなくなる。
  #
  # そこで、ワークフロー自体は常に起動させたうえで、ジョブ側の if で
  # 中身を丸ごとスキップする方式にする。スキップされたジョブは
  # ステータスチェック上「成功」として扱われるので、ドキュメントや
  # モデルだけの変更でも必須チェックが緑になり、待たされない。
  changes:
    name: 変更内容を判定
    # PR のときだけ動かす。このジョブはチェックアウトせず GitHub API で
    # 変更ファイル一覧を取る作りにしてあり、それは pull_request イベントでしか
    # 効かない。push (main へのマージ後) や手動実行では動かさない
    # — check/playtest 側は event_name を見て別途フル実行に倒れるので、
    # ここで判定結果が要らない。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # チェックアウトせず GitHub API で変更ファイル一覧を取るので、この権限が要る。
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!design/**"
              - "!plan/**"
              - "!tools/preview/**"
              - "!tools/models/**"
              - "!tools/build_models.py"
              - "!tools/compare_models.mjs"
              - "!public/models/**"
              - "!.github/workflows/models.yml"
          # 既定の quantifier (some) は否定パターンを無視してしまい、
          # "**" だけで全マッチしてしまう。"**" からの除外を効かせるには
          # some-with-excludes が要る。
          predicate-quantifier: some-with-excludes

  check:
    name: 型・テスト・ビルド
    needs: changes
    # PR に対してだけ判定を効かせる。push (main へのマージ後) や手動実行は
    # 「その push が何を含むか」の基準を取り違えるとうっかり全部スキップしかねないので、
    # 単純に毎回フルで走らせる。マージ後の確認的な位置づけなので頻度も低い。
    #
    # changes ジョブ自体が失敗した(API 障害など)場合は、判定不能を「スキップしてよい」
    # ではなく「フル実行する」側に倒す。判定が壊れて静かに検査を素通りする方が怖い。
    #
    # 先頭の !cancelled() は必須。GitHub は「needs のジョブがスキップされたら
    # 後続もスキップ」を既定とし、if に always()/!cancelled() 等を書いたときだけ
    # それを上書きできる。これが無いと、changes が PR 以外でスキップされるのに
    # 引きずられて check ごとスキップされ、main へのマージ後に何も検査されない。
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.code == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        # ダンジョン生成の到達可能性(1000シード)と、コミット済み .glb の検査を含む
        run: npm run test

      - name: 本番ビルド
        run: npm run build

      - name: ビルド成果物を残す
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  playtest:
    name: 実機での通しプレイ
    # check には依存させない。直列にすると check の30秒ぶんまるごと待ってから
    # 始まることになり、CI 全体で最も長いこのジョブの開始がそのぶん遅れる。
    # 型エラーで落ちる PR では通しプレイが無駄になるが、待ち時間の短縮を優先する。
    needs: changes
    # このジョブだけで数分かかるので、PR と手動実行に限る。main へのマージ後は
    # 軽い check だけで「個々は緑だった変更が合流して壊れた」を捕まえる。
    # !cancelled() が要る理由は check 側のコメントを参照。
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' || (
          github.event_name == 'pull_request' && (
            needs.changes.result != 'success' ||
            needs.changes.outputs.code == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # キャッシュキーに使うので、範囲指定ではなく固定する
      PLAYWRIGHT_VERSION: "1.56.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ブラウザ本体はキャッシュから戻す。毎回ダウンロードすると 26〜32 秒かかり、
      # ビルドやテストより長い。バージョンを固定しているので、上げたときだけ取り直す。
      - name: Chromium をキャッシュから戻す
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      # playwright は依存に入れていない。ブラウザまで抱えると、遊びたいだけの人にも
      # 数百MBを背負わせることになるため、CI でだけ入れる。
      - name: Chromium を用意する
        env:
          # npm 側でブラウザまで取りに行かせない。取得は playwright install に一本化する
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm i --no-save playwright@${PLAYWRIGHT_VERSION}
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            echo "キャッシュから復元したので、ダウンロードは省略する"
          fi

      - name: 本番ビルド
        run: npm run build

      - name: プレビューサーバーを起動して待つ
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ -o /dev/null; then
              echo "サーバーが立ち上がりました"
              exit 0
            fi
            sleep 1
          done
          echo "プレビューサーバーが起動しませんでした"
          cat preview.log
          exit 1

      # 拠点から潜り、歩いて戦ってアイテムを使い、倒れて拠点に戻るまでを実際に操作する。
      # ページ内で例外や 4xx が出ていれば、スクリプトが 1 で終了する。
      # ランナーに GPU は無いので WebGL は SwiftShader で動かしている。
      - name: 通しプレイ
        env:
          URL: http://127.0.0.1:4173/
          OUT: playtest-shots
        run: npm run playtest

      - name: スクリーンショットを残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playtest-shots
          path: playtest-shots/
          retention-days: 7
          if-no-files-found: warn
