<?xml version="1.0" encoding="UTF-8"?>
<!--
  ガルドの顔(目・眉・鼻・口・頬)を2Dデザインとして持つ唯一の情報源。
  plan/models/garudo-face-qa.md 参照。

  **座標系は顔一致QA(tools/compare_face.py)のウィンドウと同一**:
    SVG(sx, sy) → モデル(x, z):  x = sx/2000 - 0.16,  z = 1.02 - sy/2000
    1 SVG単位 = 0.5mm。QAが出す「◯mmずれ」は、その2倍を足し引きすればよい。

  基準(設定画の実測、compare_face.pyの出力より):
    目の中心L (31.5, 846.0)mm → (383, 348)   目頭L (17.0, 851.0) → (354, 338)
    目尻L (47.5, 844.5) → (415, 351)         上瞼L (31.5, 858.0) → (383, 324)
    下瞼L (31.5, 830.0) → (383, 380)         眉下端 (20,874)(32,865)(46,866)
    鼻 (0, 828) → (320, 384)                 口 (0, 800) → (320, 440)

  再ラスタライズ:
    node tools/render_svg.mjs design/characters/garudo/face.svg
    (出力 tools/preview/garudo/face.png を
     design/characters/garudo/generated/garudo-face-decal.png へ複製)

  背景は透明。透明なところはモデル側の肌色がそのまま出る。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560"
     viewBox="0 0 640 560">
  <defs>
    <!-- 左目(モデルの+X側)。右目はこれを鏡像で使う -->
    <g id="eye">
      <!-- 輪郭線。目頭(354,338)・上瞼(383,324)・目尻(415,351)・下瞼(383,380)。
           設定画は目尻が下がり、目頭・目尻が縦の中心より上にある -->
      <path d="M 352,337 C 360,321 374,318 384,323
               C 399,329 412,341 417,352
               C 411,371 396,382 383,381
               C 367,379 354,358 352,337 Z"
            fill="#1f1410"/>
      <!-- 白目 -->
      <path d="M 358,340 C 365,328 375,326 384,330
               C 397,336 407,345 411,353
               C 405,368 394,376 383,375
               C 369,373 360,357 358,340 Z"
            fill="#f7f5f0"/>
      <!-- 虹彩(縦長。上まぶたに少し隠れる) -->
      <ellipse cx="384" cy="352" rx="15" ry="21" fill="#432b1c"/>
      <ellipse cx="384" cy="354" rx="12" ry="17" fill="#945c28"/>
      <!-- 瞳 -->
      <ellipse cx="384" cy="353" rx="6" ry="9" fill="#1a1109"/>
      <!-- 上まぶたの太い線(虹彩の上を隠す) -->
      <path d="M 352,337 C 360,321 374,318 384,323
               C 399,329 412,341 417,352
               C 410,345 397,337 384,333
               C 373,330 361,333 352,337 Z"
            fill="#1f1410"/>
      <!-- ハイライト2粒 -->
      <ellipse cx="376" cy="341" rx="6" ry="5" fill="#ffffff"/>
      <ellipse cx="393" cy="366" rx="3" ry="2.6" fill="#ffffff"/>
    </g>
    <!-- 左の眉。下端が (360,292)(384,310)(412,308) を通る -->
    <g id="brow">
      <path d="M 356,286 C 372,290 398,296 416,301
               L 414,309 C 396,304 372,299 358,294 Z"
            fill="#33210f"/>
    </g>
  </defs>

  <!-- 目(左・右) -->
  <use href="#eye"/>
  <use href="#eye" transform="translate(640,0) scale(-1,1)"/>
  <!-- 眉(左・右) -->
  <use href="#brow"/>
  <use href="#brow" transform="translate(640,0) scale(-1,1)"/>

  <!-- 鼻: ごく小さな影 -->
  <ellipse cx="320" cy="384" rx="4" ry="5" fill="#d1a381" opacity="0.85"/>

  <!-- 口: 小さな一文字(口角をわずかに下げる) -->
  <path d="M 299,442 C 310,437 330,437 341,442
           C 330,440 310,440 299,442 Z"
        fill="#70382d"/>

  <!-- 頬のほんのり赤み -->
  <ellipse cx="420" cy="410" rx="24" ry="16" fill="#f2b394" opacity="0.35"/>
  <ellipse cx="220" cy="410" rx="24" ry="16" fill="#f2b394" opacity="0.35"/>
</svg>
