<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 -30 180 240" width="270" height="240">
  <!-- ガルド 側面(描き直しv2、右向き)。正面(garudo.svg)と同じ
       90年代アニメ調の様式(太い輪郭線・少ないアンカー点・大胆な
       髪の塊・控えめな目)で揃える。 -->

  <g stroke="#1a1108" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- 背負いダル(背面へ大きく張り出す、丸みのある塊として独立させる。
         中を刳り抜かない単純な卵形にする) -->
    <path d="M100,65 C113,65 124,78 124,95 C124,112 113,125 100,125
             C87,125 76,112 76,95 C76,78 87,65 100,65 Z" fill="#6b4423"/>
    <path d="M79,85 L121,81" fill="none" stroke-width="3"/>
    <path d="M78,105 L122,101" fill="none" stroke-width="3"/>

    <!-- 頭(側面。鼻先が前方(右)に出る) -->
    <path d="M155,8 C176,8 192,24 192,44 C192,50 196,54 198,58
             C199,60 197,62 194,62 C191,68 184,76 174,82
             C166,86 156,86 148,82 C134,76 126,62 126,46
             C126,24 138,8 155,8 Z" fill="#e0a878"/>

    <!-- 髪(4塊、後方(左)へ流れる) -->
    <path d="M150,20 C142,10 142,-6 150,-14 C154,-2 158,10 164,18
             C158,22 152,22 150,20 Z" fill="#241a12"/>
    <path d="M134,22 C124,14 120,-2 126,-12 C132,-2 138,8 144,16
             C140,20 136,22 134,22 Z" fill="#241a12"/>
    <path d="M122,28 C110,24 100,10 102,-2 C112,0 122,8 128,18
             C126,22 124,26 122,28 Z" fill="#241a12"/>
    <path d="M164,20 C160,10 164,-4 174,-8 C176,2 174,12 170,20
             C168,22 166,22 164,20 Z" fill="#241a12"/>

    <!-- 目(側面、進行方向側に1つ) -->
    <path d="M172,40 C176,36 184,36 187,41 C189,45 186,50 180,50
             C175,50 171,46 171,43 C171,42 171,41 172,40 Z" fill="#f2ede3"/>
    <path d="M178,40 C182,39 186,41 184,45 C182,48 177,47 176,44
             C176,42 177,41 178,40 Z" fill="#1a1108"/>
    <path d="M180,41 C182,40 184,41 183,43 C182,44 180,43 180,41 Z" fill="#fff" stroke="none"/>
    <path d="M172,28 C178,25 184,26 188,30" fill="none" stroke-width="4.5"/>
    <path d="M186,54 C190,56 194,55 196,52" fill="none" stroke-width="3"/>

    <!-- 胴(くびれを作って裾のエプロンより細く) -->
    <path d="M142,86 C150,82 158,82 164,86 C170,90 172,100 168,110
             C164,118 158,122 152,122 C146,122 140,118 138,110
             C136,100 136,90 142,86 Z" fill="#d99a10"/>

    <!-- 腕(1本、前方へわずかに構える) -->
    <path d="M162,90 C174,94 184,104 186,116 C188,126 184,138 178,146
             C174,151 166,150 165,144 C169,136 170,126 166,116
             C163,106 158,98 154,92 C157,90 160,89 162,90 Z" fill="#d99a10"/>
    <path d="M180,144 C186,144 190,150 186,156 C182,161 172,161 169,155
             C167,151 170,144 176,143 C178,143 179,143 180,144 Z" fill="#e0a878"/>

    <!-- 脚(1本) -->
    <path d="M144,148 C154,146 162,148 166,152 C168,160 166,174 164,190
             C163,196 141,196 140,190 C138,174 138,160 140,152
             C141,150 142,149 144,148 Z" fill="#2c3244"/>

    <!-- 樽板エプロン(前方(右)・後方(左)双方へ張り出す膨らみ→くびれ) -->
    <path d="M126,120 C130,112 142,106 156,106 C168,106 178,111 182,119
             C185,125 182,134 175,138 C184,142 184,152 175,158
             C165,163 138,163 130,158 C123,153 121,144 128,138
             C121,133 122,125 126,120 Z" fill="#d99a10"/>
    <path d="M126,132 C138,128 168,129 180,133" fill="none" stroke-width="3.5"/>
    <path d="M128,150 C140,155 168,155 178,150" fill="none" stroke-width="3.5"/>
  </g>

  <text x="155" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333" stroke="none">ガルド 側面(90年代アニメ調・描き直しv2)</text>
</svg>
