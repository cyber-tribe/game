  <!-- 写実ドラフト3: draft2(服・髪・顔つきの写実素体)に対する
       自己検査での指摘2点を直した版。
       (1) 手が黒塗りシルエットで丸いだけの塊(旧ミトン手と同じ見え方)
           だったため、親指の切れ込みを深くした。
       (2) 生業(樽守り)の視覚化が服の意匠に一切無かったため、
           背中に負う樽を左肩の後ろから覗かせ、胸に負い紐を通した。
           旧デザインの「樽板エプロン」(胴に貼り付けた装飾板)とは
           別物で、実際に背負っている物として体の輪郭の外側に
           配置している。 -->
