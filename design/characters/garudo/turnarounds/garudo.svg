<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 300 240" width="300" height="240">
  <!-- ガルド 正面(描き直しv2)。90年代の日本のアニメ・漫画調への
       参照指示(plan/models/anime-look-art-direction.md「3.5」)を
       受け、太く迷いのない輪郭線・少ないアンカー点・大胆な少数の
       髪の塊・大きすぎない目、へ全面的に描き直した。
       plan/models/figure-drawing-practice.mdの2.5頭身素体
       (肘≒腰・手首≒股・膝≒脚の中程)は維持する。 -->

  <g stroke="#1a1108" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- 背負いダルの上端(頭・胴より奥) -->
    <path d="M132,68 C138,52 162,52 168,68" fill="#6b4423"/>

    <!-- 頭(丸みのある輪郭、少ないアンカー点) -->
    <path d="M150,8 C172,8 190,26 190,50 C190,68 178,80 163,84
             C155,86 145,86 137,84 C122,80 110,68 110,50
             C110,26 128,8 150,8 Z" fill="#e0a878"/>

    <!-- 髪(4つの大胆な塊、頭頂から右上へ流れる) -->
    <path d="M120,22 C112,10 114,-8 122,-14 C126,4 132,16 140,22
             C132,26 124,26 120,22 Z" fill="#241a12"/>
    <path d="M138,16 C134,0 140,-20 152,-24 C152,-6 152,10 156,20
             C150,22 142,20 138,16 Z" fill="#241a12"/>
    <path d="M156,18 C158,2 170,-14 184,-14 C178,0 174,14 172,24
             C166,24 160,22 156,18 Z" fill="#241a12"/>
    <path d="M172,24 C180,14 196,8 206,14 C196,20 188,28 182,34
             C178,32 174,28 172,24 Z" fill="#241a12"/>

    <!-- 胴(単純な卵形、裾はエプロンより細く絞ってくびれを作る) -->
    <path d="M138,86 C146,82 154,82 162,86 C170,90 174,100 170,110
             C166,118 158,122 150,122 C142,122 134,118 130,110
             C126,100 130,90 138,86 Z" fill="#d99a10"/>

    <!-- 腕(円柱+丸い手、力強い張り出し) -->
    <path d="M170,90 C182,94 194,104 196,118 C198,130 194,144 188,152
             C184,158 174,158 172,150 C176,140 178,128 174,116
             C171,106 166,98 162,92 C165,90 168,89 170,90 Z" fill="#d99a10"/>
    <path d="M130,90 C118,94 106,104 104,118 C102,130 106,144 112,152
             C116,158 126,158 128,150 C124,140 122,128 126,116
             C129,106 134,98 138,92 C135,90 132,89 130,90 Z" fill="#d99a10"/>
    <path d="M188,150 C194,150 198,156 194,162 C190,167 180,167 176,162
             C173,158 176,150 182,149 C184,149 186,149 188,150 Z" fill="#e0a878"/>
    <path d="M112,150 C106,150 102,156 106,162 C110,167 120,167 124,162
             C127,158 124,150 118,149 C116,149 114,149 112,150 Z" fill="#e0a878"/>

    <!-- 脚(単純な円柱) -->
    <path d="M132,148 C144,146 156,146 168,148 C170,158 168,172 166,190
             C165,196 135,196 134,190 C132,172 130,158 132,148 Z" fill="#2c3244"/>

    <!-- 樽板エプロン: 胴より張り出させ(膨らみ)、中央で一度絞り
         (くびれ)、また張り出す(膨らみ)。輪郭の凹凸そのものを
         色を消しても分かる大きさにする -->
    <path d="M114,118 C120,110 134,104 150,104 C166,104 180,110 186,118
             C190,124 188,134 180,138 C190,142 190,152 180,158
             C168,164 132,164 120,158 C110,152 110,142 120,138
             C112,134 110,124 114,118 Z" fill="#d99a10"/>
    <path d="M122,132 C134,128 166,128 178,132" fill="none" stroke-width="3.5"/>
    <path d="M122,150 C134,155 166,155 178,150" fill="none" stroke-width="3.5"/>

    <!-- 目(中〜やや大きめのアーモンド形、白目控えめ) -->
    <path d="M158,44 C162,38 174,37 180,42 C184,46 183,54 176,57
             C169,59 160,55 158,49 C157,47 157,46 158,44 Z" fill="#f2ede3"/>
    <path d="M142,44 C138,38 126,37 120,42 C116,46 117,54 124,57
             C131,59 140,55 142,49 C143,47 143,46 142,44 Z" fill="#f2ede3"/>
    <path d="M167,44 C171,42 177,44 176,49 C175,53 169,54 166,51
             C164,49 165,45 167,44 Z" fill="#1a1108"/>
    <path d="M133,44 C129,42 123,44 124,49 C125,53 131,54 134,51
             C136,49 135,45 133,44 Z" fill="#1a1108"/>
    <path d="M170,45 C172,44 174,45 173,47 C172,49 169,48 170,45 Z" fill="#fff" stroke="none"/>
    <path d="M130,45 C128,44 126,45 127,47 C128,49 131,48 130,45 Z" fill="#fff" stroke="none"/>

    <!-- 眉(太く短い、迷いない1本) -->
    <path d="M120,32 C128,28 136,28 142,31" fill="none" stroke-width="4.5"/>
    <path d="M180,32 C172,28 164,28 158,31" fill="none" stroke-width="4.5"/>
    <!-- 鼻・口(点と1本線) -->
    <path d="M150,58 L150,62" fill="none" stroke-width="3"/>
    <path d="M142,68 C146,72 154,72 158,68" fill="none" stroke-width="3"/>
  </g>

  <text x="150" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333" stroke="none">ガルド 正面(90年代アニメ調・描き直しv2)</text>
</svg>
