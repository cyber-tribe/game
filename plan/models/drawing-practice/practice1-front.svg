<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <!-- 練習1: 8頭身カノンの人体(正面・Aポーズ)
       plan/models/figure-drawing-practice.md
       構造線(ジェスチャー・量塊・関節)のレイヤーを消さずに残す -->

  <!-- ガイド線(頭身カノンの検算用) -->
  <g stroke="#0af" stroke-width="0.75" stroke-dasharray="3,3">
    <line x1="0" y1="10" x2="300" y2="10"/>
    <line x1="0" y1="38" x2="300" y2="38"/>
    <line x1="0" y1="66" x2="300" y2="66"/>
    <line x1="0" y1="94" x2="300" y2="94"/>
    <line x1="0" y1="122" x2="300" y2="122"/>
    <line x1="0" y1="136" x2="300" y2="136"/>
    <line x1="0" y1="171" x2="300" y2="171"/>
    <line x1="0" y1="234" x2="300" y2="234"/>
  </g>
  <g font-family="sans-serif" font-size="7" fill="#0af">
    <text x="202" y="9">0頭 頭頂</text>
    <text x="202" y="37">1頭 あご</text>
    <text x="202" y="65">2頭 乳頭</text>
    <text x="202" y="93">3頭 へそ/肘</text>
    <text x="202" y="121">4頭 股/手首</text>
    <text x="202" y="135">4.5頭 指先</text>
    <text x="202" y="170">5.75頭 膝</text>
    <text x="202" y="233">8頭 接地面</text>
  </g>

  <!-- 量塊(頭・胸郭・骨盤の3ブロック、傾きは正面のため無し)。
       このレイヤーは検証用に残す -->
  <g fill="none" stroke="#f80" stroke-width="1" opacity="0.7">
    <ellipse cx="150" cy="24" rx="10" ry="14"/>
    <path d="M128,44 L172,44 L167,94 L133,94 Z"/>
    <path d="M133,94 L167,94 L170,108 L130,108 Z"/>
    <path d="M130,108 L170,108 L165,122 L135,122 Z"/>
  </g>
  <!-- 重心線(ジェスチャー) -->
  <path d="M150,10 L150,234" stroke="#f80" stroke-width="1" stroke-dasharray="1,3" opacity="0.7" fill="none"/>

  <!-- 関節(丸) -->
  <g fill="#fff" stroke="#e00" stroke-width="1.2">
    <circle cx="150" cy="38" r="3"/>          <!-- 首 -->
    <circle cx="172" cy="52" r="3"/>          <!-- 右肩 -->
    <circle cx="128" cy="52" r="3"/>          <!-- 左肩 -->
    <circle cx="188" cy="94" r="3"/>          <!-- 右肘 -->
    <circle cx="112" cy="94" r="3"/>          <!-- 左肘 -->
    <circle cx="178" cy="122" r="3"/>         <!-- 右手首 -->
    <circle cx="122" cy="122" r="3"/>         <!-- 左手首 -->
    <circle cx="163" cy="122" r="3"/>         <!-- 右股 -->
    <circle cx="137" cy="122" r="3"/>         <!-- 左股 -->
    <circle cx="165" cy="171" r="3"/>         <!-- 右膝 -->
    <circle cx="135" cy="171" r="3"/>         <!-- 左膝 -->
    <circle cx="162" cy="222" r="3"/>         <!-- 右足首 -->
    <circle cx="138" cy="222" r="3"/>         <!-- 左足首 -->
  </g>

