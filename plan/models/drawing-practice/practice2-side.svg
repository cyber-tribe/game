<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <!-- 練習2: 8頭身カノンの人体(側面)。練習1と同じガイド線の高さを
       使う。胸郭はやや後ろへ、骨盤はやや前へ傾けるS字を意識する
       (板のような直立した側面を避ける)。plan/models/
       figure-drawing-practice.md -->

  <g stroke="#0af" stroke-width="0.75" stroke-dasharray="3,3">
    <line x1="0" y1="10" x2="300" y2="10"/>
    <line x1="0" y1="38" x2="300" y2="38"/>
    <line x1="0" y1="66" x2="300" y2="66"/>
    <line x1="0" y1="94" x2="300" y2="94"/>
    <line x1="0" y1="122" x2="300" y2="122"/>
    <line x1="0" y1="136" x2="300" y2="136"/>
    <line x1="0" y1="171" x2="300" y2="171"/>
    <line x1="0" y1="234" x2="300" y2="234"/>
  </g>
  <g font-family="sans-serif" font-size="7" fill="#0af">
    <text x="202" y="9">0頭 頭頂</text>
    <text x="202" y="37">1頭 あご</text>
    <text x="202" y="65">2頭 乳頭</text>
    <text x="202" y="93">3頭 へそ/肘</text>
    <text x="202" y="121">4頭 股/手首</text>
    <text x="202" y="135">4.5頭 指先</text>
    <text x="202" y="170">5.75頭 膝</text>
    <text x="202" y="233">8頭 接地面</text>
  </g>

  <!-- 量塊(胸郭は後ろへ-6、骨盤は前へ+5、のS字傾き) -->
  <g fill="none" stroke="#f80" stroke-width="1" opacity="0.7">
    <ellipse cx="150" cy="24" rx="12" ry="14"/>
    <path d="M138,44 L162,40 L158,94 L134,98 Z"/>
    <path d="M134,98 L158,94 L164,108 L140,112 Z"/>
    <path d="M140,112 L164,108 L160,122 L142,124 Z"/>
  </g>
  <!-- 重心線(S字) -->
  <path d="M150,10 C148,40 136,70 142,94 C148,118 158,118 158,150 C158,190 150,210 150,234" stroke="#f80" stroke-width="1" stroke-dasharray="1,3" opacity="0.7" fill="none"/>

  <g fill="#fff" stroke="#e00" stroke-width="1.2">
    <circle cx="150" cy="40" r="3"/>          <!-- 首 -->
    <circle cx="160" cy="50" r="3"/>          <!-- 肩(側面は1つ) -->
    <circle cx="172" cy="94" r="3"/>          <!-- 肘 -->
    <circle cx="166" cy="122" r="3"/>         <!-- 手首 -->
    <circle cx="151" cy="122" r="3"/>         <!-- 股 -->
    <circle cx="156" cy="171" r="3"/>         <!-- 膝 -->
    <circle cx="150" cy="222" r="3"/>         <!-- 足首 -->
  </g>

  <g fill="#333" stroke="#000" stroke-width="1" opacity="0.85">
    <!-- 頭(側面。後頭部が張り出し、あごが前に出る) -->
    <path d="M150,10 C158,10 165,16 166,24 C167,31 163,37 158,38 C154,39 145,38 141,36
             C137,34 133,26 135,20 C137,14 144,10 150,10 Z"/>
    <!-- 胴(胸郭が後ろ、腰が前のS字を反映した輪郭) -->
    <path d="M141,36 C148,34 156,34 158,38 C165,44 168,52 168,60
             C168,72 160,88 158,94 C157,100 162,104 164,108
             C166,113 163,120 158,122 C150,124 144,123 140,120
             C136,116 138,110 140,106 C136,100 132,86 134,74
             C135,62 133,48 136,42 C138,38 138,38 141,36 Z"/>
    <!-- 腕(側面は1本、体側にわずかに離れて垂れる) -->
    <path d="M162,50 C168,53 174,62 175,70 C176,80 174,88 172,94
             C170,100 168,108 168,116 C168,122 167,130 166,136
             C165,140 160,140 159,136 C158,130 159,122 159,116
             C159,108 159,100 159,92 C159,82 159,70 159,62
             C159,56 159,52 162,50 Z"/>
    <!-- 脚(側面は1本、膝でわずかに前へ) -->
    <path d="M144,120 C148,122 154,122 158,122 C160,130 159,140 158,148
             C157,156 158,164 156,171 C155,178 154,186 154,196
             C154,206 155,216 154,224 C153,230 145,230 144,224
             C143,216 144,206 144,196 C144,186 143,178 142,171
             C140,164 141,156 140,148 C139,140 140,128 144,120 Z"/>
    <!-- 足 -->
    <path d="M144,224 C148,222 154,222 154,224 C158,226 168,228 168,232
             C168,235 158,236 150,236 C142,236 138,235 138,232
             C138,228 140,226 144,224 Z"/>
  </g>

  <text x="150" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">練習2: 8頭身・側面(S字の重心線)</text>
</svg>
