<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <!-- 練習3: 練習1の人体を2.5頭身へ圧縮する。頭を大きく、胸郭・骨盤を
       縮めるが、ランドマークの相対関係(肘≒腰、手首≒股、膝≒脚の
       中程)は保つ。plan/models/figure-drawing-practice.md -->

  <g stroke="#0af" stroke-width="0.75" stroke-dasharray="3,3">
    <line x1="0" y1="10" x2="300" y2="10"/>
    <line x1="0" y1="80" x2="300" y2="80"/>
    <line x1="0" y1="143" x2="300" y2="143"/>
    <line x1="0" y1="147" x2="300" y2="147"/>
    <line x1="0" y1="164" x2="300" y2="164"/>
    <line x1="0" y1="185" x2="300" y2="185"/>
  </g>
  <g font-family="sans-serif" font-size="7" fill="#0af">
    <text x="222" y="9">頭頂</text>
    <text x="222" y="79">あご/肩</text>
    <text x="222" y="142">肘≒腰</text>
    <text x="222" y="156">手首≒股</text>
    <text x="222" y="163">膝(脚の中程)</text>
    <text x="222" y="184">接地面</text>
  </g>

  <!-- 量塊(頭は巨大に、胸郭・骨盤は小さく圧縮。塊の数と接続は
       練習1と変えない) -->
  <g fill="none" stroke="#f80" stroke-width="1" opacity="0.7">
    <ellipse cx="150" cy="45" rx="35" ry="35"/>
    <path d="M126,80 L174,80 L168,112 L132,112 Z"/>
    <path d="M132,112 L168,112 L163,132 L137,132 Z"/>
  </g>
  <path d="M150,10 L150,185" stroke="#f80" stroke-width="1" stroke-dasharray="1,3" opacity="0.7" fill="none"/>

  <g fill="#fff" stroke="#e00" stroke-width="1.2">
    <circle cx="150" cy="80" r="3"/>
    <circle cx="172" cy="86" r="3"/>
    <circle cx="128" cy="86" r="3"/>
    <circle cx="184" cy="143" r="3"/>   <!-- 肘≒腰 -->
    <circle cx="116" cy="143" r="3"/>
    <circle cx="176" cy="147" r="3"/>   <!-- 手首≒股 -->
    <circle cx="124" cy="147" r="3"/>
    <circle cx="160" cy="132" r="3"/>   <!-- 股 -->
    <circle cx="140" cy="132" r="3"/>
    <circle cx="162" cy="164" r="3"/>   <!-- 膝(脚の中程) -->
    <circle cx="138" cy="164" r="3"/>
    <circle cx="158" cy="183" r="3"/>
    <circle cx="142" cy="183" r="3"/>
  </g>

  <g fill="#333" stroke="#000" stroke-width="1" opacity="0.85">
    <!-- 頭(巨大) -->
    <path d="M150,10 C170,10 185,26 185,45 C185,60 176,72 163,77
             C155,80 145,80 137,77 C124,72 115,60 115,45
             C115,26 130,10 150,10 Z"/>
    <!-- 胴(短く圧縮、肩→腰→股) -->
    <path d="M137,80 C143,78 157,78 163,80 C170,83 174,96 174,104
             C174,110 172,116 168,120 C160,124 140,124 132,120
             C128,116 126,110 126,104 C126,96 130,83 137,80 Z"/>
    <!-- 右腕: 肘が腰(y=143)、手首が股(y=147)に来るよう短く -->
    <path d="M168,84 C176,87 184,94 186,104 C188,114 186,126 184,136
             C183,141 185,146 182,149 C178,152 170,150 168,146
             C167,141 170,132 170,124 C170,114 166,100 164,92
             C163,88 164,84 168,84 Z"/>
    <path d="M132,84 C124,87 116,94 114,104 C112,114 114,126 116,136
             C117,141 115,146 118,149 C122,152 130,150 132,146
             C133,141 130,132 130,124 C130,114 134,100 136,92
             C137,88 136,84 132,84 Z"/>
    <!-- 脚: 股(132)から膝(164、脚の中程)を通り接地面(185)へ -->
    <path d="M156,120 C160,121 164,121 168,120 C170,128 168,136 166,143
             C165,148 166,155 164,164 C163,170 165,178 163,183
             C161,186 151,186 150,183 C149,180 150,174 150,168
             C150,160 148,150 148,143 C148,135 148,126 144,120 Z"/>
    <path d="M144,120 C140,121 136,121 132,120 C130,128 132,136 134,143
             C135,148 134,155 136,164 C137,170 135,178 137,183
             C139,186 149,186 150,183 C151,180 150,174 150,168
             C150,160 152,150 152,143 C152,135 152,126 156,120 Z"/>
  </g>

  <text x="150" y="204" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">練習3: 2.5頭身への圧縮(肘≒腰・手首≒股・膝≒脚の中程)</text>
</svg>
